<!DOCTYPE html>
<html lang="{{ config.default_language }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ config.title }}</title>
    <meta name="description" content="{{ config.description }}" />
    <link rel="canonical" href="{{ get_url(path='') }}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ config.title }}" />
    <meta property="og:description" content="{{ config.description }}" />
    <meta property="og:url" content="{{ get_url(path='') }}" />
    <meta name="twitter:card" content="summary" />

    <!-- Root-relative on purpose: these resolve on whichever domain is serving
         the page, so nothing breaks while the custom domain is being moved.
         The canonical/og URLs above stay absolute, which is what they're for. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main>
      <header>
        <img
          class="avatar"
          src="{{ config.extra.avatar }}"
          alt="{{ config.extra.avatar_alt }}"
          width="88"
          height="88"
          decoding="async"
        />
        <div class="identity">
          <h1>{{ config.title }}</h1>
          <p class="tagline">{{ config.extra.tagline }}</p>
        </div>
      </header>

      <section class="intro">
        {{ section.content | safe }}
      </section>

      <nav class="projects" aria-label="Projects and sites">
        <h2>Elsewhere</h2>
        <ul>
          {% for project in config.extra.projects %}
          <li>
            <a href="{{ project.url }}">
              <span class="name">{{ project.name }}</span>
              <span class="description">{{ project.description }}</span>
            </a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <footer>
        <nav aria-label="Contact and profiles">
          <ul>
            {% for link in config.extra.social %}
            <li><a href="{{ link.url }}">{{ link.name }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      </footer>
    </main>
  </body>
</html>
