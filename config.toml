# Zola configuration. Docs: https://www.getzola.org/documentation/getting-started/configuration/
#
# `base_url` only affects absolute URLs Zola generates itself (canonical link,
# feeds, `get_url`). Every link in `[extra]` below is either a root-relative
# path or a full external URL, so the site keeps working both at
# https://calebstewart.github.io and later at https://calebstew.art.
base_url = "https://calebstew.art"

title = "Caleb Stewart"
description = "Software engineer, penetration tester, and reverse engineer."
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = true

[markdown]
smart_punctuation = true

[extra]
tagline = "Software Engineer · Penetration Tester · Reverse Engineer"

# Served straight from GitHub so it tracks whatever avatar the account has —
# nothing to re-upload here when you change it. The path takes the *numeric*
# user id, not the username. `s` is the requested pixel size: it's 2x the
# displayed 88px so the image stays sharp on HiDPI screens.
avatar = "https://avatars.githubusercontent.com/u/7529189?s=176&v=4"
avatar_alt = "Caleb Stewart"

# ---------------------------------------------------------------------------
# Things I run. Root-relative paths ("/stewos/") point at GitHub Pages project
# sites under this same account, so they resolve correctly on whichever domain
# this landing page is currently served from.
# ---------------------------------------------------------------------------
[[extra.projects]]
name = "Resume"
url = "/resume/"
description = "Where I've worked and what I've built."

[[extra.projects]]
name = "StewOS"
url = "/stewos/"
description = "My NixOS system and Home Manager configurations."

[[extra.projects]]
name = "AI Slop"
url = "/ai-slop/"
description = "Agent skills and prompt scaffolding I actually use."

[[extra.projects]]
name = "Recipes"
url = "/recipes/"
description = "A small app for the recipes I actually cook."

# Catch-all, deliberately last: keeps the curated list above short without
# hiding anything, so a project doesn't need its own entry here to be findable.
[[extra.projects]]
name = "All Repositories"
url = "https://github.com/calebstewart?tab=repositories"
description = "Everything else I've put on GitHub."

# ---------------------------------------------------------------------------
# Where to find me.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Resume. Read by BOTH `templates/resume.html` (web) and `resume.typ` (PDF),
# so the two can't drift. Zola's config is TOML, and Typst reads TOML natively,
# which is why this can be shared with no conversion step.
# ---------------------------------------------------------------------------
[extra.resume]
name = "Caleb Stewart"
title = "Software Engineer, Penetration Tester, Reverse Engineer"
location = "Arlington, VA"
email = "caleb.stewart94@gmail.com"
github = "calebstewart"
gitlab = "caleb.stewart"
linkedin = "calebjstewart"

# These lists are the single source of truth for BOTH which entries appear and
# what order they appear in — the web template and resume.typ each walk them in
# order, so the page and the PDF cannot disagree. Reorder here to reorder both.
#
# They're explicit rather than discovered because Typst has no directory
# enumeration, by design, so that compilation stays hermetic. `nix flake check`
# fails if a file exists on disk but is missing from these lists.
experience = [
  "huntress.md",
  "cybercom.md",
  "coast-guard-cpt.md",
  "coast-guard-soc.md",
  "cgc-bertholf.md",
  "nsa.md",
]
projects = [
  "cve-credits.md",
  "pwncat.md",
  "katana.md",
  "ctf4hire.md",
  "stewieos.md",
]

