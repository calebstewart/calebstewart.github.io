name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # No binary cache step here on purpose. magic-nix-cache-action now
      # attempts a FlakeHub login and fails the step without an account, which
      # annotates every run red while the build succeeds anyway. Everything
      # this build needs (zola, typst, roboto) substitutes from cache.nixos.org
      # in well under a minute, so a cache buys little. If build time ever
      # becomes a problem, FlakeHub Cache or actions/cache over /nix is the fix.

      # Catches a résumé content file that exists on disk but is missing from
      # the lists in config.toml, which would silently drop it from the site.
      - name: Check
        run: nix flake check --print-build-logs

      # `nix build` runs the exact same derivation as `nix build` locally, so
      # CI cannot drift from what you preview on your machine. This builds the
      # PDF résumé too and places it at /resume.pdf in the output.
      - name: Build site
        run: nix build .#site --print-build-logs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `result` is a symlink into the Nix store; the action dereferences it.
          path: result/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
